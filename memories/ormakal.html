<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paradise of Ross (റോസിന്റെ പറുദീസ) — സ്നേഹത്തോടെ എഴുതിയ കുറിപ്പുകൾ</title>
<meta name="description" content="പഠിച്ചതും ചിന്തിച്ചതും സ്നേഹത്തോടെ പങ്കുവെക്കുന്ന കുറിപ്പുകളുടെ വളരുന്ന ശേഖരം.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --bg:#f3f1ec; --ink:#1d2a2e; --muted:#5b6a6e; --line:#d3d8d4; --accent:#1f6f78; --paper:#fbfaf7; --petal:#d98ca0; --glow1:rgba(31,111,120,.16); --glow2:rgba(217,140,160,.2);
  --shadow:0 10px 30px rgba(29,42,46,.08);
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#101918;--ink:#e6ece9;--muted:#9fb0ac;--line:#2d3f3d;--accent:#6fc3c9;--paper:#182321;--petal:#e3a3b3;--glow1:rgba(111,195,201,.12);--glow2:rgba(227,163,179,.1);--shadow:0 10px 30px rgba(0,0,0,.35)}
}
:root[data-theme="dark"]{--bg:#101918;--ink:#e6ece9;--muted:#9fb0ac;--line:#2d3f3d;--accent:#6fc3c9;--paper:#182321;--petal:#e3a3b3;--glow1:rgba(111,195,201,.12);--glow2:rgba(227,163,179,.1);--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif Malayalam","Manjari","Kartika",Georgia,serif;line-height:1.95;font-size:1.0625rem;overflow-x:hidden;animation:pagein .6s ease-out both;transition:opacity .35s ease}
body.leaving{opacity:0}
@keyframes pagein{from{opacity:0}to{opacity:1}}
p{margin:0 0 1rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* background */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;width:44rem;height:44rem;border-radius:50%;filter:blur(40px)}
.b1{top:-14rem;left:-12rem;background:radial-gradient(circle,var(--glow1),transparent 65%);animation:drift 26s ease-in-out infinite alternate}
.b2{bottom:-16rem;right:-14rem;background:radial-gradient(circle,var(--glow2),transparent 65%);animation:drift 32s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate3d(6rem,4rem,0) scale(1.15)}}
.petal{position:absolute;top:0;background:var(--petal);border-radius:80% 0 80% 0;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-3rem,0) rotate(0);opacity:0}10%{opacity:.4}90%{opacity:.3}100%{transform:translate3d(var(--dx),105vh,0) rotate(400deg);opacity:0}}

/* header */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.bar{max-width:60rem;margin:0 auto;padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.45rem;font-weight:700;letter-spacing:.01em;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:.55rem}
.dot{width:.7rem;height:.9rem;background:var(--petal);border-radius:80% 0 80% 0;transform:rotate(-20deg)}
.music{display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.9rem;line-height:1.4;padding:.4rem 1rem;border-radius:2rem;cursor:pointer;transition:border-color .2s,color .2s}
.music:hover{border-color:var(--accent)}
.music[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.eq{display:flex;align-items:flex-end;gap:2px;height:.8rem}
.eq i{width:2px;height:30%;background:currentColor;border-radius:1px}
.music[aria-pressed="true"] .eq i{animation:eq 1s ease-in-out infinite}
.music[aria-pressed="true"] .eq i:nth-child(2){animation-delay:-.4s}
.music[aria-pressed="true"] .eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* layout */
main{position:relative;z-index:1;transition:opacity .3s ease}
main.out{opacity:0}
.sec{max-width:60rem;margin:0 auto;padding:4.5rem 1.5rem 0}
.eyebrow{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.5rem}
h1{font-family:"Cormorant Garamond","Noto Serif Malayalam",Georgia,serif;font-size:clamp(3rem,10vw,6rem);line-height:1.05;margin:0 0 1.5rem;font-weight:700;letter-spacing:-.01em}
h1.ml{font-family:"Noto Serif Malayalam","Manjari",Georgia,serif;font-size:clamp(2rem,6vw,3.2rem);line-height:1.5;letter-spacing:0;margin-bottom:1rem}
h1 span{background:linear-gradient(100deg,var(--accent),var(--petal));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(1.5rem,4vw,2rem);line-height:1.5;margin:0 0 1rem;font-weight:700}
h2.line::after{content:"";display:block;width:3rem;height:3px;background:var(--accent);border-radius:2px;margin-top:.6rem}
.hero{padding-top:5rem}
.lead{font-size:1.25rem;color:var(--muted);max-width:40rem}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
.btn{display:inline-block;padding:.7rem 1.6rem;border-radius:2rem;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:700;border:1px solid var(--accent);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--accent)}
.quote{margin-top:3.5rem;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:1.5rem 1.75rem;box-shadow:var(--shadow);max-width:44rem}
.quote p{margin:0}
.copy{max-width:42rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.2rem;margin-top:1.5rem}
.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1.5rem;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--accent)}
.card.cat{border-left:4px solid var(--accent)}
.num{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.2rem;color:var(--petal);font-weight:700;line-height:1}
.card h3{font-size:1.15rem;margin:.6rem 0 .3rem;line-height:1.6}
.card p{margin:0;color:var(--muted);font-size:1rem;line-height:1.85}
.intro{font-size:1.15rem;color:var(--muted);max-width:42rem}
.cta{text-align:center;margin-top:5rem;padding:3rem 1.5rem;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.cta h2::after{margin:.6rem auto 0}
.cta p{max-width:36rem;margin-left:auto;margin-right:auto}
.back{display:inline-block;margin-top:2.5rem;color:var(--accent);text-decoration:none;font-weight:700;transition:transform .2s}
.back:hover{transform:translateX(-4px)}
footer{position:relative;z-index:1;max-width:60rem;margin:5rem auto 0;padding:1.5rem 1.5rem 3rem;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem;text-align:center}

/* motion */
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero .eyebrow,.top .eyebrow{animation:enter 1.2s ease-out both}
.hero h1,.top h1{animation:enter 1.4s ease-out .15s both}
.hero .lead,.top .intro{animation:enter 1.4s ease-out .45s both}
.hero .actions{animation:enter 1.4s ease-out .75s both}
.js .reveal{opacity:0;transform:translateY(24px);transition:opacity 1s ease-out,transform 1s ease-out}
.js .reveal.in{opacity:1;transform:none}
.grid .reveal:nth-child(2){transition-delay:.1s}
.grid .reveal:nth-child(3){transition-delay:.2s}
.grid .reveal:nth-child(4){transition-delay:.3s}
.grid .reveal:nth-child(5){transition-delay:.4s}
@media (prefers-reduced-motion:reduce){
  body{animation:none;transition:none}
  .petal,.blob,.eq i{animation:none!important}.petal{display:none}
  .hero *,.top *{animation:none!important}
  .js .reveal{opacity:1;transform:none;transition:none}
  main{transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div id="petals"></div></div>

<header class="site">
  <div class="bar">
    <a class="brand" href="#home"><span class="dot"></span>Paradise of Ross</a>
    <button class="music" id="music" type="button" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="mlabel">Play music</span></button>
  </div>
</header>

<!-- ============ HOME ============ -->
<main id="home">
  <section class="sec hero">
    <div class="eyebrow">റോസിന്റെ പറുദീസ</div>
    <h1><span>Paradise of Ross</span></h1>
    <p class="lead">എന്റെ മനസ്സിൽ വിരിഞ്ഞ ചിന്തകൾക്കും, ഞാൻ പഠിച്ച പാഠങ്ങൾക്കും, ഹൃദയത്തോട് ചേർത്തുവെച്ച ഓർമ്മകൾക്കുമായി ഒരു ചെറിയ സ്വർഗ്ഗം.</p>
    <div class="actions">
      <a class="btn" href="#memories">കുറിപ്പുകളിലേക്ക് വരൂ</a>
      <a class="btn ghost" href="#story">കഥ വായിക്കാം</a>
    </div>
    <div class="quote reveal">
      <p>ഒരു തോട്ടത്തിൽ പൂക്കൾ
