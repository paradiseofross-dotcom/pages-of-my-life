<script>
/* =========================================================
   SOUND BUTTON — ON / OFF
   ========================================================= */

const soundButton =
  document.getElementById("snd");

if(soundButton){

  soundButton.addEventListener(
    "click",
    async function(){

      try{

        /* Create audio system only when required */
        if(!AC)
          startAudio();

        /* Resume AudioContext if browser suspended it */
        if(AC.state === "suspended"){
          await AC.resume();
        }

        /* Toggle sound state */
        audioOn = !audioOn;

        /* =========================
           SOUND ON
           ========================= */
        if(audioOn){

          MG.gain.cancelScheduledValues(
            AC.currentTime
          );

          MG.gain.setValueAtTime(
            0,
            AC.currentTime
          );

          MG.gain.linearRampToValueAtTime(
            .85,
            AC.currentTime + .15
          );

          /* Audible confirmation */
          tone(
            "sine",
            440,
            .15,
            .01,
            .18,
            .2,
            0
          );

          setTimeout(
            ()=>{
              if(audioOn){
                tone(
                  "sine",
                  660,
                  .10,
                  .01,
                  .22,
                  .2,
                  0
                );
              }
            },
            130
          );

          onK();

          document.getElementById(
            "sl"
          ).textContent =
            "ശബ്ദം ഓഫ് ചെയ്യൂ";

          document.getElementById(
            "si"
          ).textContent = "🔊";

          soundButton.setAttribute(
            "aria-pressed",
            "true"
          );

        }

        /* =========================
           SOUND OFF
           ========================= */
        else{

          MG.gain.cancelScheduledValues(
            AC.currentTime
          );

          /* Immediately mute ALL audio */
          MG.gain.setValueAtTime(
            0,
            AC.currentTime
          );

          document.getElementById(
            "sl"
          ).textContent =
            "ശബ്ദം ഓൺ ചെയ്യൂ";

          document.getElementById(
            "si"
          ).textContent = "🔇";

          soundButton.setAttribute(
            "aria-pressed",
            "false"
          );
        }

      }catch(err){

        console.error(
          "Audio error:",
          err
        );

        audioOn = false;

        if(MG && AC){

          MG.gain.cancelScheduledValues(
            AC.currentTime
          );

          MG.gain.setValueAtTime(
            0,
            AC.currentTime
          );
        }

        document.getElementById(
          "sl"
        ).textContent =
          "ശബ്ദം ഓൺ ചെയ്യൂ";

        document.getElementById(
          "si"
        ).textContent = "🔇";

        soundButton.setAttribute(
          "aria-pressed",
          "false"
        );
      }
    }
  );
}


/* =========================================================
   HOME BUTTON — GO TO MAIN PAGE
   ========================================================= */

const homeButton =
  document.getElementById("hm");

if(homeButton){

  homeButton.addEventListener(
    "click",
    ()=>{
      window.location.href = "index.html";
    }
  );
}
</script>
