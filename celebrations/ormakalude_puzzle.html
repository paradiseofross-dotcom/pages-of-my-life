<style>

#intro{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}

<script>
const S=[
{t:`ഓർമ്മകളുടെ പസിൽ`,m:`gather`,e:`🧩`,p:[
`ഒരു കൊച്ചുകുട്ടി തറയിലിരുന്ന് പസിൽ കളിക്കുകയാണ്. മുന്നിൽ പല ആകൃതിയിലും നിറത്തിലുമുള്ള കഷണങ്ങൾ ചിതറിക്കിടക്കുന്നു. ഓരോന്നും ശ്രദ്ധയോടെ പരിശോധിച്ച് ചേരുന്നവ കണ്ടെത്താൻ കുട്ടി ശ്രമിക്കുന്നു. ചിലത് ചേർന്നുവെന്ന് തോന്നിയാലും അടുത്ത കഷണം പൊരുത്തപ്പെടാതെ വരുമ്പോൾ വീണ്ടും വേർപെടുത്തി മറ്റൊന്ന് പരീക്ഷിക്കുന്നു.`,
`മുഴുവൻ ചിത്രം മുന്നിലുണ്ടെങ്കിലും അത് പൂർത്തിയാക്കാനുള്ള വഴി എളുപ്പമല്ല. ക്ഷമയോടെ ഓരോ കഷണത്തിന്റെയും സ്ഥാനം കണ്ടെത്തുന്ന ആ കുട്ടിയെപ്പോലെ, ഒരുകാലത്ത് അനുഭവങ്ങളും മുഖങ്ങളും പേരുകളും സ്നേഹബന്ധങ്ങളും നിറഞ്ഞിരുന്ന സ്വന്തം ഓർമ്മകളിൽനിന്ന് പരിചിതമായതെല്ലാം വീണ്ടും കണ്ടെത്താൻ ശ്രമിക്കുകയാണ് ഒരാൾ.`,
`ഇന്ന് ആ ഓർമ്മകൾ പതുക്കെ അഴിഞ്ഞുപോകുന്നു. മുഖങ്ങളും പേരുകളും സംഭവങ്ങളും തമ്മിൽ ആശയക്കുഴപ്പം ഉണ്ടാകുന്നു. ശബ്ദങ്ങളിലൂടെയും മുഖങ്ങളിലൂടെയും പഴയ പരിചയങ്ങൾ ചിലപ്പോൾ തെളിഞ്ഞുവരുമെങ്കിലും, അവയെല്ലാം ചേർത്ത് പൂർണമായൊരു ചിത്രം മനസ്സിൽ വരയ്ക്കുക എളുപ്പമല്ല.`,
`ആ ഓർമ്മക്കഷണങ്ങൾക്കിടയിൽ പരിചിതമായതെന്തോ തേടിക്കൊണ്ടിരിക്കുന്ന ആൾ മറ്റാരുമല്ല — നമ്മുടെ സ്വന്തം അമ്മച്ചി.`]},
{t:`2026 ഒക്ടോബർ 15 — ബേബിയുടെ ഫോൺവിളി`,m:`ring`,e:`📞`,p:[
`ഉച്ചഭക്ഷണത്തിനുശേഷം ഞാനും സുപ്രിയയും അമ്മച്ചിയും ലിവിങ് റൂമിലിരുന്ന് സംസാരിക്കുകയായിരുന്നു. അപ്പോഴാണ് ബേബിയുടെ ഫോൺവിളി വന്നത്.`,
`ബേബി|ഹലോ.`,`ഞാൻ|ആ, പറഞ്ഞോ ബേബി.`,`ബേബി|Good afternoon.`,`ഞാൻ|Good afternoon.`,
`ബേബി|എവിടെയാ? വീട്ടിലാണോ?`,`ഞാൻ|അതെ, വീട്ടിലുണ്ട്.`,`ബേബി|ഊണൊക്കെ കഴിഞ്ഞോ?`,
`ഞാൻ|ദേ, ഇപ്പോൾ കഴിച്ചതേയുള്ളൂ. ഞാനും സുപ്രിയയും അമ്മച്ചിയും കൂടി ലിവിങ് റൂമിലിരുന്ന് സംസാരിക്കുകയായിരുന്നു.`,
`അന്ന് റോസ് ബേബിയുടെ കൂടെയുണ്ടായിരുന്നു. ഫോണിലൂടെ എന്റെ ശബ്ദം കേട്ടപ്പോൾ വിളിക്കുന്നത് പരിചിതനായ കാഞ്ചിയാണെന്ന് റോസ് തിരിച്ചറിഞ്ഞു. ഉടനെ കുഞ്ഞുസ്വരത്തിൽ വിളിച്ചു:`,
`റോസ്|കാഞ്ചി!`,
`ആ ഒറ്റ വാക്കിൽ കുഞ്ഞിന്റെ നിഷ്കളങ്കമായ സ്നേഹവും കുടുംബബന്ധത്തിന്റെ അടുപ്പവും നിറഞ്ഞിരുന്നു.`,
`സംസാരത്തിനിടയിൽ ബേബി അടുത്ത ദിവസത്തെ പരിപാടിയെക്കുറിച്ച് ചോദിച്ചു.`,
`ബേബി|നാളെ വൈകിട്ട് വല്ല പരിപാടിയുമുണ്ടോ?`,`ഞാൻ|നാളെയോ?`,`ബേബി|ആ, നാളെ വൈകുന്നേരം എല്ലാവരും കൂടി ഇങ്ങോട്ട് പോരേ?`,`ഞാൻ|ആണോ?`,
`ബേബി|ആ, രാത്രി ഭക്ഷണമൊക്കെ കഴിച്ചിട്ട് പോകാം. പിള്ളേരെയും വിളിക്കുവോ?`,
`ഞാൻ|എന്താ, അവരും (Bangalore teams) വരുന്നുണ്ടായിരുന്നോ?`,
`ബേബി|ആ, അതുതന്നെ. ചേച്ചിയും അനിയത്തിയും കൂടി വന്നാൽ എല്ലാവർക്കും ഒരുമിച്ചിരുന്ന് സന്തോഷിക്കാമല്ലോ എന്ന് വിചാരിച്ചിട്ടാണ്.`,
`ഞാൻ|ആ, ഓക്കെ, ഓക്കെ.`,`ബേബി|അപ്പോൾ നമുക്കെല്ലാവർക്കും കൂടി സന്തോഷിച്ചിരിക്കാം.`,`ഞാൻ|ശരി, ഓക്കെ.`,
`ബേബി|ഓക്കെ, ഞാൻ ക്ലോഡിയെയും കൂടി വിളിച്ചേക്കട്ടെ?`,`ഞാൻ|ആ, ശരി, വിളിച്ചോ.`,
`അങ്ങനെ അടുത്ത ദിവസം വൈകുന്നേരം എല്ലാവരും കൂടി ചുള്ളിക്കലിൽ ഒത്തുചേരാനുള്ള ക്ഷണം ഉറപ്പായി.`]},
{t:`അടുത്ത ദിവസത്തേക്കുള്ള ഒരുക്കങ്ങൾ`,m:`gather`,e:`🚗`,p:[
`അന്ന് വൈകുന്നേരം ഞാൻ സുപ്രിയയെ വിളിച്ച് ബേബിയുടെ ക്ഷണത്തെക്കുറിച്ച് പറഞ്ഞു. ചുള്ളിക്കലേക്കു പോകുന്നതും ആരൊക്കെ വരുമെന്നതും ഞങ്ങൾ സംസാരിച്ചു. ജിഷയെ കൂടി വിളിച്ച് വിവരം അറിയിക്കാമെന്ന് സുപ്രിയ പറഞ്ഞു. അമ്മച്ചിയെയും കൂടെ കൊണ്ടുപോകാൻ തീരുമാനിച്ചു.`,
`വൈകുന്നേരം എല്ലാവരും ഒത്തുചേരുന്നതിനെക്കുറിച്ച് സംസാരിച്ചശേഷം യാത്രയ്ക്കുള്ള ഒരുക്കങ്ങൾ നടത്തി.`,
`അന്ന് വൈകുന്നേരം ക്ലോഡിയുടെ കാറിൽ ക്ലോഡി, ജിഷാ, അമ്മച്ചി, സുപ്രിയ, ഞാനും കൂടി ചുള്ളിക്കലേക്കു പുറപ്പെട്ടു.`,
`ചുള്ളിക്കലെത്തിയപ്പോൾ ഗേറ്റ് തുറന്നുകിടക്കുകയായിരുന്നു. കാർ പള്ളിയുടെ കോമ്പൗണ്ടിൽ പാർക്ക് ചെയ്ത ശേഷം ഞങ്ങൾ വീട്ടിലേക്ക് നടന്നു.`]},
{t:`റോസിന്റെ കുഞ്ഞുലോകം`,m:`gather`,e:`🚜`,p:[
`ഞങ്ങളെ റോസും ബേബിയും ക്ലെസ്സിയും ചേർന്ന് വരവേറ്റു. ആദ്യം റോസ് കുറച്ചുസമയം നാണിച്ചുനിന്നു. അപ്പോഴാണ് ക്ലെസ്സി ജെ.സി.ബി. കളിപ്പാട്ടവും വേളാങ്കണ്ണിയിൽനിന്ന് വാങ്ങിയ ട്രാൻസ്ഫോർമർ കാറും കാണിക്കാൻ പറഞ്ഞത്. മടി മാറിയ റോസ് കളിപ്പാട്ടങ്ങൾ ഓരോന്നായി ഞങ്ങൾക്ക് കാണിച്ചുതുടങ്ങി.`,
`പിന്നീട് ക്ലെസ്സി സ്പൈഡർമാന്റെ ആക്ഷൻ കാണിക്കാൻ ആവശ്യപ്പെട്ടു. റോസ് കൂടുതൽ ആവേശത്തിലായി. സ്പൈഡർമാന്റെ ചലനങ്ങൾ അനുകരിച്ചും കളിപ്പാട്ടങ്ങൾ ഉപയോഗിച്ച് ചെറിയ രംഗങ്ങൾ സൃഷ്ടിച്ചും കളിയിൽ മുഴുകി.`,
`അടുത്തതായി ജെ.സി.ബി.യും ട്രാൻസ്ഫോർമർ കാറും തമ്മിൽ റേസ് നടത്തി. കാറും ജെ.സി.ബി.യും മുന്നോട്ടും പിന്നോട്ടും നീക്കി കളിക്കുന്നതിനിടെ ജെ.സി.ബി. എന്റെ കൈയിൽ ഏൽപ്പിച്ചു.`,
`കളിപ്പാട്ടങ്ങളോട് എനിക്ക് എന്നും പ്രത്യേക ഇഷ്ടമുണ്ടായിരുന്നു. കോളേജ് കാലത്ത് എം.ജി. റോഡിലെ പൈക്കോ സ്റ്റോറിലെ കളിപ്പാട്ടവിഭാഗത്തിൽ മണിക്കൂറുകളോളം ചെലവഴിച്ചിരുന്നതും ഫൺസ്കൂളിന്റെ ചെറിയ കാറുകളോടുണ്ടായിരുന്ന ആകർഷണവും ഓർമ്മ വന്നു. റോസിന്റെ കളിപ്പാട്ടം കൈയിൽ പിടിച്ചപ്പോൾ കുട്ടിക്കാലത്തെയും യൗവനകാലത്തെയും ചെറിയ സന്തോഷങ്ങൾ വീണ്ടും തെളിഞ്ഞു.`,
`റോസ് കാറുകളുമായി കളിച്ചുകൊണ്ടിരിക്കുമ്പോഴാണ് ജിഷ അവരുടെ വീട്ടിലെ മരത്തടി മേൽക്കൂരയിലേക്ക് നോക്കിയത്. മേൽക്കൂരപ്പണിക്ക് ഉപയോഗിച്ചിരിക്കുന്ന മരത്തിന്റെ സ്വഭാവവും അതിന് നൽകിയിരുന്ന വാർണിഷ് ഫിനിഷും ജിഷ ശ്രദ്ധയോടെ താരതമ്യം ചെയ്യാൻ തുടങ്ങി. മരത്തിന്റെ നിറം, മിനുസം, വാർണിഷ് പൂശിയതിന്റെ തിളക്കം എന്നിവയെക്കുറിച്ച് സംസാരിച്ചുകൊണ്ട്, വീടിന്റെ നിർമ്മാണത്തിലെ ചെറിയ വിശദാംശങ്ങൾ പോലും എത്ര ശ്രദ്ധേയമാകാമെന്ന് ജിഷ ചൂണ്ടിക്കാട്ടി. റോസിന്റെ കളിയുടെ ശബ്ദത്തിനിടയിൽ ആ സംഭാഷണം മറ്റൊരു കൗതുകലോകം തുറന്നു.`]},
{t:`ബാംഗ്ലൂർ സംഘത്തിന്റെ വരവ്`,m:`gather`,e:`🏠`,p:[
`ഇതിനിടയിൽ ക്ലെസ്സി ബാംഗ്ലൂർ സംഘത്തിലുള്ള ഷാലിയെയും ഷപ്പുവിനെയും ഫോണിൽ വിളിച്ചുകൊണ്ടിരുന്നു. അവർ ഫോർട്ട് കൊച്ചിയിലല്ല, മരടിലാണ് ഹോംസ്റ്റേ ബുക്ക് ചെയ്തിരുന്നത്. അവിടെനിന്ന് ചുള്ളിക്കലേക്കു വരേണ്ടതുണ്ടെന്നും വഴിയിൽ റോഡ് ബ്ലോക്കുകളുണ്ടെന്നും അപ്പോഴാണ് മനസ്സിലായത്.`,
`ദീർഘയാത്ര കാരണം എല്ലാവരും ക്ഷീണിതരായിരുന്നതിനാൽ ഒരു Uber ബുക്ക് ചെയ്തു. കുറച്ചുസമയത്തിനുശേഷം ഷാലി, ഷപ്പു, അനി, കാക്കി — അമ്മച്ചിയുടെ സഹോദരിയായ ആഡ്‍ലി — കൂടാതെ ഷപ്പുവിന്റെയും അനിയുടെയും മക്കളായ അർണവും ആര്യനും വീട്ടിലെത്തി.`,
`ഞങ്ങൾ എല്ലാവരെയും സന്തോഷത്തോടെ വരവേറ്റു. വീട്ടിൽനിന്ന് ജോലി ചെയ്തുകൊണ്ടിരുന്ന ക്രിസ്റ്റീനയും പുറത്തുവന്ന് അഭിവാദ്യം ചെയ്തു.`,
`ഏറെ നേരത്തെ കാത്തിരിപ്പിനുശേഷമുള്ള ആ കൂടിക്കാഴ്ച വീടിനുള്ളിൽ സന്തോഷം നിറച്ചു. ദൂരെയുള്ള സ്ഥലങ്ങളിൽ കഴിയുന്ന കുടുംബാംഗങ്ങൾ ഒരുമിച്ചെത്തുമ്പോൾ മാറ്റിവെക്കേണ്ടിവന്ന സംഭാഷണങ്ങൾക്കും പഴയ ഓർമ്മകൾ പങ്കുവെക്കുന്നതിനും അവസരം ലഭിക്കുന്നു. ആ സായാഹ്നം അങ്ങനെ കുടുംബത്തിന്റെ സന്തോഷങ്ങൾക്കും ഓർമ്മകൾക്കും വേദിയായി.`]},
{t:`അൽഫിയും കുടുംബവും — അപ്രതീക്ഷിതമായൊരു വരവ്`,m:`gather`,e:`👨‍👩‍👧`,p:[
`കുടുംബാംഗങ്ങൾ ഒത്തുകൂടി സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോഴാണ് അൽഫിയും കുടുംബവും അപ്രതീക്ഷിതമായി അവിടെയെത്തിയത്.`,
`അൽഫിയെ കണ്ടപ്പോൾ ഷപ്പുവിനോടും ഷാലിയോടും ഞാൻ ചോദിച്ചു:`,
`ഞാൻ|നിങ്ങൾക്ക് അൽഫിയെ അറിയാമോ?`,
`ഷപ്പു|അതെ, അറിയാം. അൽഫിയുടെ പപ്പയും മമ്മിയും ബാംഗ്ലൂരിൽ വന്നപ്പോൾ ഞങ്ങളുടെ വീട്ടിൽ താമസിച്ചിരുന്നു.`,
`ബാംഗ്ലൂരുമായി ബന്ധപ്പെട്ട പഴയ പരിചയങ്ങളുടെ മറ്റൊരു കണ്ണി കൂടി മുന്നിൽ തെളിഞ്ഞു. ഒരിടത്ത് ആരംഭിച്ച പരിചയം മറ്റൊരിടത്തും തുടരുകയും പിന്നീട് പുതിയ സംഭാഷണങ്ങൾക്ക് വഴിയൊരുക്കുകയും ചെയ്യുന്നു.`,
`അൽഫിയുടെ കുട്ടികൾക്ക് മുമ്പത്തേക്കാൾ നല്ല ഉയരം വെച്ചിരിക്കുന്നു. കുറച്ചുകാലത്തിനുശേഷം വീണ്ടും കാണുമ്പോഴാണ് കുട്ടികളുടെ വളർച്ചയും കാലത്തിന്റെ വേഗവും വ്യക്തമായി മനസ്സിലാകുന്നത്.`,
`സംസാരത്തിനിടെ മകൻ അബ്രഹാമിന് സ്കൂളിൽ ബാസ്കറ്റ്ബോൾ കളിക്കുമ്പോൾ കൈയ്ക്ക് പരിക്കേറ്റ കാര്യം അൽഫി പറഞ്ഞു. കുട്ടികളുടെ കളികളിലെ ആവേശത്തോടൊപ്പം ശ്രദ്ധയും സുരക്ഷയും എത്ര പ്രധാനമാണെന്ന് ആ സംഭവം ഓർമ്മിപ്പിച്ചു.`,
`അൽഫിയുടെയും കുടുംബത്തിന്റെയും അപ്രതീക്ഷിത വരവ് കൂടുതൽ പേരെ കാണാനും പഴയ പരിചയങ്ങൾ പുതുക്കാനും വിശേഷങ്ങൾ പങ്കുവെക്കാനും അവസരം നൽകിയ മനോഹരമായൊരു ഓർമ്മയായി.`]},
{t:`അതിഥികൾക്കായി ക്ലെസ്സിയുടെ വിഭവസമൃദ്ധമായ ഒരുക്കങ്ങൾ`,m:`gather`,e:`🍛`,p:[
`കുടുംബാംഗങ്ങൾ എത്തിച്ചേർന്നതോടെ വീട്ടിൽ സന്തോഷവും തിരക്കുകളും നിറഞ്ഞു. അതിഥികൾക്കായി ക്ലെസ്സി പോർക്ക്, ബോട്ടി, ബീഫ് കറി എന്നിവ ഒരുക്കിയിരുന്നു. എല്ലാവർക്കും കൂടി കഴിക്കാനായി പന്താരിയിൽനിന്ന് ചിക്കൻ ബിരിയാണിയും ഓർഡർ ചെയ്തിരുന്നു.`,
`കുടുംബസംഗമങ്ങളിൽ ഭക്ഷണത്തിന് പ്രത്യേക സ്ഥാനമുണ്ട്. വിഭവങ്ങളുടെ രുചിക്കപ്പുറം അവ ഒരുക്കാൻ ചെലവഴിക്കുന്ന സമയവും അതിനു പിന്നിലെ കരുതലുമാണ് ഭക്ഷണത്തെ സവിശേഷമാക്കുന്നത്. ക്ലെസ്സിയുടെ ഒരുക്കങ്ങൾ ആ സായാഹ്നത്തിന് കൂടുതൽ ഊഷ്മളത നൽകി.`]},
{t:`ബേബിയുടെ ആതിഥേയത്വവും വിസ്കിയെക്കുറിച്ചുള്ള തമാശകളും`,m:`gather`,e:`🥃`,p:[
`ബേബി ഡൈനിങ് ടേബിൾ ഒരുക്കിയിരുന്നു. റോയൽ ചലഞ്ചേഴ്സ് വിസ്കിയും പലതരം സ്നാക്സുകളും മേശപ്പുറത്ത് നിരത്തിയിരുന്നു. എന്നെയും ക്ലോഡിയെയും അനിയെയും ഡൈനിങ് റൂമിലേക്ക് ക്ഷണിച്ചു. ഞങ്ങൾ ഗ്ലാസുകൾ ഉയർത്തി ചിയേഴ്സ് പറഞ്ഞു.`,
`കുറച്ചുസമയത്തിനുശേഷം എല്ലാവരും ഡൈനിങ് ഹാളിൽ ഒത്തുകൂടി. ഷാലിക്കും ഷപ്പുവിനും ബേബി വിസ്കി നൽകി. വിസ്കി വിളമ്പുന്നതിനിടെ കാക്കിക്കും ഒരു പെഗ് നൽകി. അപ്പോൾ ഷാലി തമാശയോടെ പറഞ്ഞു:`,
`ഷാലി|ബേബിച്ചേട്ടനാണ് മമ്മിക്ക് ആദ്യമായി ചെറിയ ഡോസ് പരിചയപ്പെടുത്തിയത്!`,
`ചെറിയൊരു പെഗ് വിസ്കി ആരോഗ്യത്തിന് മരുന്നുപോലെയാണെന്ന മട്ടിൽ ബേബി പതിവ് ഉപദേശം നൽകി. ഉടനെ ക്ലെസ്സി ഇടപെട്ടു:`,
`ക്ലെസ്സി|ഇങ്ങനെ കുറേ പേരെ വഴിതെറ്റിച്ചു!`,
`ക്ലെസ്സിയുടെ കമന്റ് കേട്ട് എനിക്ക് ചിരി വന്നു. ബേബി അത് കേട്ടിരുന്നില്ല. അതുകൊണ്ട് ഞാൻ പറഞ്ഞു:`,
`ഞാൻ|ക്ലെസ്സി പറഞ്ഞത് കേട്ടോ? ക്ലെസ്സിക്ക് അറിയില്ലെന്നാണ്!`,
`അതിനിടയിൽ ഞാൻ അമ്മച്ചിയോട് തമാശയായി പറഞ്ഞു:`,
`ഞാൻ|അമ്മച്ചി, കണ്ടു പഠിക്ക്!`,
`അത് കേട്ടപ്പോൾ കാക്കി ചിരിച്ചുകൊണ്ട് പഴയൊരു കാര്യം ഓർമിപ്പിച്ചു. വൈപ്പിനിൽ താമസിച്ചിരുന്ന കാലത്ത് കാക്കി ആങ്ങളമാരിൽനിന്ന് ചെറിയ ഡോസുകളൊക്കെ വാങ്ങി കഴിക്കാറുണ്ടായിരുന്നുവെന്ന് കാക്കി പറഞ്ഞു.`,
`പഴയകാലത്തെ ആ ശീലം ഓർത്തെടുത്തപ്പോൾ സംഭാഷണത്തിന് മറ്റൊരു രസകരമായ വഴിത്തിരിവായി. ബേബിയുടെ പതിവ് ഉപദേശവും ഷാലിയുടെ ഓർമപ്പെടുത്തലും ക്ലെസ്സിയുടെ കുസൃതിനിറഞ്ഞ കമന്റും എന്റെ “അമ്മച്ചി, കണ്ടു പഠിക്ക്” എന്ന തമാശയും ചേർന്നപ്പോൾ എല്ലാവർക്കും ചിരിക്കാനുള്ള വകയായി.`,
`ഇത്തരം ചെറിയ സംഭാഷണങ്ങളാണ് കുടുംബസംഗമങ്ങളെ കൂടുതൽ ഹൃദ്യമാക്കുന്നത്. പഴയകാലത്തെ ശീലങ്ങളും ഓർമകളും പരസ്പരം കളിയാക്കലുകളും വീണ്ടും പങ്കുവെക്കുമ്പോൾ, കാലം പിന്നിട്ടിട്ടും കുടുംബബന്ധങ്ങളുടെ അടുപ്പം അതേപടി നിലനിൽക്കുന്നതായി തോന്നും.`]},
{t:`ലോയ്ഡിന്റെ വരവും മൂന്നാർ യാത്രാപദ്ധതിയും`,m:`gather`,e:`🏢`,p:[
`അത്താഴം വിളമ്പുന്നതിനിടയിൽ ലോയ്ഡ് ഓഫീസിൽനിന്ന് വീട്ടിലെത്തി. ഓഫീസിലെ ജോലിസമയക്രമം കാരണം പലപ്പോഴും വൈകിയാണ് ലോയ്ഡ് വീട്ടിലെത്താറുള്ളത്. ആ തിരക്കിനിടയിലും എല്ലാവരോടും ചേർന്ന് കുറച്ചുനേരം ചെലവഴിക്കാൻ കഴിഞ്ഞു.`,
`സംസാരത്തിനിടയിൽ, ലോയ്ഡിന്റെ മൂന്നാറിലേക്കുള്ള യാത്രാപദ്ധതിയെക്കുറിച്ച് ആരോ അന്വേഷിക്കുന്നത് കേട്ടു. ഓഫീസിന്റെ ഭാഗമായി മൂന്നാറിലേക്ക് ഒരു യാത്രയുണ്ടെന്നും, മടങ്ങുന്ന വഴിയിൽ രാജാക്കാട്ടുള്ള കുടുംബാംഗങ്ങളെ കൂടി കാണേണ്ടതുണ്ടെന്നും മനസ്സിലായി. അതുകൊണ്ടുതന്നെ യാത്ര എപ്പോൾ, എങ്ങനെയായിരിക്കും എന്നതിനെക്കുറിച്ചുള്ള അന്വേഷണം സ്വാഭാവികമായി സംഭാഷണത്തിൽ കടന്നുവന്നു. കുടുംബത്തെ കാണാനുള്ള ആഗ്രഹവും ഓഫീസിലെ തിരക്കിനിടയിൽ അതിനായി സമയം കണ്ടെത്തേണ്ടതിന്റെ ആവശ്യകതയും ആ ചെറിയ സംഭാഷണത്തിൽ തെളിഞ്ഞുനിന്നു.`]},
{t:`രാജക്കാട് കഥയും റൊമാന്റിക് രംഗവും`,m:`gather`,e:`🌊`,p:[
`ഭക്ഷണത്തിനിടയിൽ രാജക്കാട് യാത്രയ്ക്കിടെ ബേബി പറഞ്ഞ ഒരു കഥ എനിക്ക് ഓർമ്മ വന്നു. ഞാൻ ഷപ്പുവിനോട് ചോദിച്ചു:`,
`ഞാൻ|രാജക്കാട്ടിലെ പാറക്കെട്ടുകൾക്കിടയിലൂടെ ഒഴുകുന്ന വെള്ളത്തിൽ നടന്ന ഒരു റൊമാന്റിക് രംഗത്തെക്കുറിച്ച് ഞാൻ ഒരു കഥ കേട്ടിരുന്നു. അതെന്തായിരുന്നു?`,
`ഷപ്പു നാണിച്ച് തലകുനിച്ചു.`,
`ഷപ്പു|ഓഹ്, അതിപ്പോൾ വൈറൽ കഥയായി മാറിയല്ലോ! അയ്യോ!`,
`വെള്ളം ഒഴുകുന്ന പാറക്കെട്ടുകൾക്കിടയിലൂടെ നടക്കുമ്പോൾ വഴുക്കലുണ്ടായിരുന്നതിനാൽ അനിയോട് കൈ പിടിച്ചുനിർത്താൻ മാത്രമാണ് പറഞ്ഞതെന്ന് ഷപ്പു പറഞ്ഞു. എന്നാൽ അനി ഹിന്ദി സിനിമയിലെ രംഗംപോലെ ഷപ്പുവിനെ ഉയർത്തിയപ്പോൾ കാലിടറി ഇരുവരും വെള്ളത്തിലേക്കും പാറകളിലേക്കും വീണു. ഷപ്പുവിന്റെ കൈയ്ക്ക് പരിക്കേറ്റെങ്കിലും തലയ്ക്ക് പരിക്കേൽക്കാതിരുന്നത് ഭാഗ്യമായി.`,
`അപ്പോഴേക്കും ഷാലി ഇടപെട്ടു.`,
`ഷാലി|ഷപ്പു കഥ മാറ്റിപ്പറയുകയാണ്!`,
`ഷപ്പു തന്നെയാണ് അനിയോട് ഉയർത്താൻ ആവശ്യപ്പെട്ടതെന്നും അതുകൊണ്ടാണ് ഇരുവരും വീണതെന്നും ഷാലി വ്യക്തമാക്കി. ചെറിയൊരു ന്യായീകരണവാദം തുടങ്ങി; കേട്ടുനിന്ന ഞങ്ങൾക്ക് അത് തന്നെ രസകരമായി.`,
`അപകടസാധ്യതയുള്ള ആ നിമിഷം പിന്നീട് എല്ലാവരും ചിരിച്ചുകൊണ്ട് ഓർക്കുന്ന കുടുംബകഥയായി മാറി. യാത്രകൾ അവസാനിച്ചാലും അവയ്ക്കിടയിലെ അപ്രതീക്ഷിത സംഭവങ്ങൾ കുടുംബത്തിന്റെ ഓർമ്മകളിൽ ദീർഘകാലം നിലനിൽക്കും.`]},
{t:`അമ്മച്ചിയുടെ ചോദ്യം — “ആരാ?”`,m:`scatter`,e:`🕯️`,p:[
`അതിനിടയിൽ അമ്മച്ചിയും കാക്കിയും ഒരുമിച്ചിരുന്ന് സംസാരിക്കുകയായിരുന്നു. അമ്മച്ചി കാക്കിയോട് ചോദിക്കുന്നത് എനിക്ക് കേൾക്കാമായിരുന്നു:`,
`അമ്മച്ചി|ആരാ?`,`കാക്കി ഉടൻ മറുപടി നൽകി:`,`കാക്കി|ഇത് ആഡ്‍ലിയാണ്, അമ്മിണീ.`,
`അമ്മച്ചിക്ക് കാക്കിയെ തിരിച്ചറിയാൻ കഴിയാത്തത് കാക്കിയുടെ മുഖത്ത് വേദനയായി തെളിഞ്ഞു. ഒരുകാലത്ത് ഒരുമിച്ച് ജീവിച്ചും വളർന്നും അനേകം ഓർമ്മകൾ പങ്കുവെച്ച സഹോദരിമാർ; ഇന്ന് സ്വന്തം സഹോദരിയെ തിരിച്ചറിയാൻ കഴിയാത്ത അവസ്ഥ.`,
`ഓർമ്മകൾ നഷ്ടപ്പെടുന്നതിന്റെ ആഘാതം അനുഭവിക്കുന്നയാൾക്ക് മാത്രമല്ല, മറവിയുടെ മറുവശത്ത് നിൽക്കുന്ന പ്രിയപ്പെട്ടവർക്കും ഉണ്ടാകുന്നു. എങ്കിലും കാക്കി ആ നിമിഷത്തെ ഭാരമാക്കാതെ സ്നേഹത്തോടെ അമ്മച്ചിയോട് സംസാരിച്ചുകൊണ്ടിരുന്നു.`,
`അമ്മച്ചിക്ക് കാക്കിയെ പേരുപറഞ്ഞ് തിരിച്ചറിയാൻ കഴിഞ്ഞില്ലെങ്കിലും, കാക്കിയുടെ ശബ്ദത്തിലും സാന്നിധ്യത്തിലും പഴയൊരു പരിചയത്തിന്റെ ചൂട് അവശേഷിച്ചിരിക്കാം. പേരും മുഖവും മറന്നുപോയാലും ബന്ധത്തിന്റെ ചരിത്രവും സ്നേഹവും കുടുംബാംഗങ്ങളുടെ മനസ്സിൽ നിലനിൽക്കും.`,
`കുടുംബസംഗമത്തിലെ ചിരിക്കും സംഭാഷണങ്ങൾക്കുമിടയിൽ ആ ചോദ്യം ഞങ്ങളെ മറ്റൊരു യാഥാർഥ്യത്തിലേക്ക് കൊണ്ടുപോയി. ഒരുമിച്ച് പങ്കിട്ട ജീവിതം ഒരാളുടെ മനസ്സിൽ വ്യക്തമായി നിലനിൽക്കുമ്പോഴും, അതേ അനുഭവങ്ങൾ പങ്കിട്ട മറ്റൊരാൾക്ക് അവ തിരിച്ചറിയാൻ കഴിയാതെ വരാം. എങ്കിലും സ്നേഹത്തോടെ അരികിലിരുന്ന് സംസാരിക്കുന്നതിലൂടെ ബന്ധത്തിന്റെ ഊഷ്മളത നിലനിർത്താം.`]},
{t:`ലിവിങ് റൂമിലെ സംഭാഷണം — ബാംഗ്ലൂർ സന്ദർശനത്തിന്റെ ഓർമ്മകൾ`,m:`scatter`,e:`🛋️`,p:[
`കുറച്ചുസമയത്തിനുശേഷം കാക്കിയും അമ്മച്ചിയും ഷപ്പുവും ഡൈനിങ് ടേബിളിൽനിന്ന് എഴുന്നേറ്റ് ലിവിങ് റൂമിലേക്ക് പോയി. ചുറ്റുമുള്ള ശബ്ദവും തിരക്കും അമ്മച്ചിക്ക് അസ്വസ്ഥതയുണ്ടാക്കുന്നുണ്ടെന്ന് തോന്നി.`,
`അവിടെ ഷപ്പു അമ്മച്ചിയോട് ബാംഗ്ലൂർ സന്ദർശനത്തെക്കുറിച്ച് വിശദീകരിച്ചു. ഒരിക്കൽ താൻ ബാംഗ്ലൂരിൽ വന്നതും അന്ന് നടന്ന കാര്യങ്ങളും ഓർമിപ്പിക്കാൻ ശ്രമിച്ചെങ്കിലും, അമ്മച്ചിക്ക് ആ യാത്രയെക്കുറിച്ച് വ്യക്തമായ ഓർമ്മയുണ്ടായിരുന്നില്ല.`,
`ആരോഗ്യവും ഓർമശക്തിയും മെച്ചമായിരുന്ന കാലത്ത് നടന്ന യാത്ര പോലും ഇന്ന് തിരിച്ചുപിടിക്കാൻ കഴിയാത്തത് വേദനാജനകമായിരുന്നു. ഒരിക്കൽ സ്വന്തം കാര്യങ്ങൾ സ്വയം നിർവഹിച്ചിരുന്ന അമ്മച്ചിക്ക് ഇന്ന് ജീവിതത്തിലെ ചില അനുഭവങ്ങൾ ഓർത്തെടുക്കാൻ മറ്റുള്ളവരുടെ സഹായം ആവശ്യമായി വരുന്നു.`,
`നമ്മുടെ ജീവിതത്തിലെ നിമിഷങ്ങൾ പിന്നീട് ഓർമ്മകളായി മാറുന്നു. എന്നാൽ അവയും പതുക്കെ മങ്ങുമ്പോൾ, ആ ജീവിതത്തിന്റെ കഥകൾ മറ്റുള്ളവർ പറഞ്ഞുകൊടുക്കേണ്ടിവരുന്നു. അമ്മച്ചിയുടെ ജീവിതത്തിലെ ചില അധ്യായങ്ങൾ മറന്നുപോയെങ്കിലും, അവ ഓർത്തുവെച്ച് വീണ്ടും പങ്കുവെക്കാൻ ഷപ്പുവിനെപ്പോലുള്ള കുടുംബാംഗങ്ങൾ കൂടെയുണ്ടെന്നത് ആശ്വാസകരമാണ്.`,
`അങ്ങനെ കുടുംബത്തിന്റെ ഓർമ്മകൾ ഒരാളുടെ മനസ്സിൽ മാത്രം ഒതുങ്ങാതെ എല്ലാവരിലുമായി പങ്കുവെക്കപ്പെടുന്നു. ഒരാൾക്ക് നഷ്ടപ്പെടുന്ന ഓർമ്മകളെ മറ്റുള്ളവർ സ്നേഹത്തോടെ സംരക്ഷിക്കുന്നു. കുടുംബം എന്നത് ബന്ധുക്കളുടെ കൂട്ടായ്മ മാത്രമല്ല; പരസ്പരം മറന്നുപോകുന്ന കാര്യങ്ങൾ ഓർത്തുവെക്കുന്ന ഒരു ലോകം കൂടിയാണ്.`]},
{t:`ഓർമ്മയിൽ തങ്ങിനിൽക്കുന്ന ഒരു സായാഹ്നം`,m:`gather`,e:`🌅`,p:[
`2026 ഒക്ടോബർ 16-ലെ ആ സായാഹ്നത്തിൽ പലതും സംഭവിച്ചു. റോസിന്റെ കുഞ്ഞുകളികൾ, പഴയ കളിപ്പാട്ടങ്ങളോടുള്ള എന്റെ കൗതുകം, ജിഷ മരത്തടി മേൽക്കൂരയും വാർണിഷ് ഫിനിഷും താരതമ്യം ചെയ്ത സംഭാഷണം, ബാംഗ്ലൂർ സംഘത്തിന്റെ വരവ്, അൽഫിയുടെയും കുടുംബത്തിന്റെയും അപ്രതീക്ഷിത സന്ദർശനം, ക്ലെസ്സി ഒരുക്കിയ ഭക്ഷണം, ബേബിയുടെ ആതിഥേയത്വം, വിസ്കിയെക്കുറിച്ചുള്ള തമാശകൾ, രാജക്കാട് യാത്രയിലെ കഥ, അമ്മച്ചിയുടെ ഓർമ്മകളെക്കുറിച്ചുള്ള വേദനാജനകമായ നിമിഷങ്ങൾ — എല്ലാം ഒരേ ദിവസത്തിന്റെ ഭാഗമായി.`,
`അമ്മച്ചി കാക്കിയോട് “ആരാ?” എന്ന് ചോദിച്ചതും ബാംഗ്ലൂർ സന്ദർശനം ഓർത്തെടുക്കാൻ കഴിയാതിരുന്നതും ആ സായാഹ്നത്തിലെ ഏറ്റവും വേദനാജനകമായ ഓർമ്മകളായി. ഒരിക്കൽ പങ്കിട്ട ജീവിതത്തിന്റെ പല അധ്യായങ്ങളും ഇന്ന് അമ്മച്ചിയുടെ ഓർമ്മയിൽനിന്ന് മാഞ്ഞുപോയിരിക്കാം.`,
`അതേസമയം, റോസ് തന്റെ കുഞ്ഞുലോകത്തിലെ സന്തോഷങ്ങളുമായി എല്ലാവരെയും അടുപ്പിച്ചു. ബാംഗ്ലൂരിൽനിന്നെത്തിയവർ പഴയ ബന്ധങ്ങൾ പുതുക്കി. അൽഫിയുടെ കുടുംബം പുതിയ വിശേഷങ്ങൾ പങ്കുവെച്ചു. രാജക്കാട് യാത്രയിലെ തമാശ എല്ലാവരെയും ചിരിപ്പിച്ചു. ക്ലെസ്സിയുടെ ഭക്ഷണവും ബേബിയുടെ ആതിഥേയത്വവും എല്ലാവർക്കും ഒരുമിച്ചിരിക്കാനുള്ള സന്തോഷം നൽകി.`,
`ജീവിതം ഇങ്ങനെയുള്ള വൈരുധ്യങ്ങൾ നിറഞ്ഞതാണ്. ഒരു വശത്ത് കുട്ടികൾ വളർന്ന് പുതിയ ഓർമ്മകൾ സൃഷ്ടിക്കുന്നു; മറുവശത്ത്, ഒരിക്കൽ അനേകം മുഖങ്ങളും പേരുകളും സൂക്ഷിച്ചിരുന്ന അമ്മച്ചിയുടെ ഓർമ്മകൾ മങ്ങുന്നു.`,
`പസിലിന്റെ കഷണങ്ങൾ ചിതറിപ്പോകുമ്പോൾ അവയെല്ലാം വീണ്ടും ചേർത്ത് പൂർണമായൊരു ചിത്രം കണ്ടെത്തുക പ്രയാസമാണ്. അമ്മച്ചിയുടെ ഓർമ്മകളുടെ ലോകവും അങ്ങനെതന്നെ. ചില കഷണങ്ങൾ വ്യക്തമാണ്; ചിലത് മങ്ങിയിരിക്കുന്നു; ചിലത് ശരിയായ സ്ഥാനത്ത് ചേരാതെ കിടക്കുന്നു. എങ്കിലും ആ ചിത്രത്തിലെ സ്നേഹത്തിന്റെ നിറം പൂർണമായി മാഞ്ഞുപോയിട്ടില്ലെന്ന് വിശ്വസിക്കാനാണ് എനിക്ക് ഇഷ്ടം.`,
`റോസിന്റെ “കാഞ്ചി!” എന്ന വിളി, കാക്കി അമ്മിണിയോട് സ്നേഹത്തോടെ സംസാരിച്ച രീതി, ഷപ്പു പഴയ യാത്രകൾ ഓർമിപ്പിക്കാൻ നടത്തിയ ശ്രമം, എല്ലാവരെയും ഒരുമിച്ചുകൂട്ടാൻ ബേബി കാണിച്ച താൽപ്പര്യം, അൽഫിയുടെ കുടുംബവുമായി പങ്കുവെച്ച വിശേഷങ്ങൾ, അതിഥികൾക്കായി ക്ലെസ്സി ഒരുക്കിയ ഭക്ഷണം — ഇതെല്ലാം കുടുംബബന്ധങ്ങളുടെ ആഴം ഓർമിപ്പിക്കുന്നു.`,
`കുട്ടികളുടെ വളർച്ചയും മുതിർന്നവരുടെ ഓർമ്മകളും ഒരേ സായാഹ്നത്തിൽ മുന്നിൽ തെളിഞ്ഞപ്പോൾ കാലത്തിന്റെ ഒഴുക്ക് വ്യക്തമായി അനുഭവപ്പെട്ടു. ഇന്നലെകളിലെ കുട്ടികൾ ഇന്ന് വളർന്ന് പുതിയ അനുഭവങ്ങൾ പങ്കുവെക്കുന്നു; ഒരിക്കൽ അനേകം പേരുകളുടെയും മുഖങ്ങളുടെയും ഓർമ്മകൾ സൂക്ഷിച്ചിരുന്ന അമ്മച്ചിക്ക് ഇന്ന് അവയിൽ ചിലത് തിരിച്ചറിയാൻ കഴിയുന്നില്ല.`,
`ഓർമ്മകൾ എല്ലായ്പ്പോഴും നമ്മൾ ആഗ്രഹിക്കുന്നതുപോലെ നിലനിൽക്കണമെന്നില്ല. ചില മുഖങ്ങളും പേരുകളും മറന്നുപോകാം. പക്ഷേ, ആ വ്യക്തിയെ സ്നേഹിക്കുന്നവരുടെ ഓർമ്മകളിൽ അവരുടെ ജീവിതവും ബന്ധങ്ങളും സൂക്ഷിക്കപ്പെടുന്നു.`,
`അമ്മച്ചിയുടെ ഓർമ്മകളുടെ പസിലിൽ നഷ്ടപ്പെട്ട ചില കഷണങ്ങൾ ഇനി തിരികെ കിട്ടിയെന്നുവരില്ല. എങ്കിലും കുടുംബാംഗങ്ങൾ സ്നേഹത്തോടെ ചേർന്നുനിൽക്കുമ്പോൾ, ആ ജീവിതചിത്രത്തിലെ സ്നേഹത്തിന്റെ ഭാഗങ്ങൾ നിലനിൽക്കും. പഴയ കഥകൾ പറഞ്ഞും പുതിയ അനുഭവങ്ങൾ പങ്കുവെച്ചും അരികിലിരുന്നും കുടുംബം ആ ചിത്രം ചേർത്തുവെക്കുന്നു.`,
`ഒരുപക്ഷേ, ഓർമ്മകളുടെ യഥാർഥ സൗന്ദര്യം അവയെല്ലാം കൃത്യമായി ഓർത്തെടുക്കുന്നതിൽ മാത്രമല്ല. ഓർമ്മകൾ മങ്ങിത്തുടങ്ങുന്ന ഒരാളുടെ അരികിൽനിന്ന് മാറാതെ, ആ ജീവിതത്തിന്റെ കഥ സ്നേഹത്തോടെ സൂക്ഷിക്കുന്നതിലുമാണ്.`,
`അമ്മച്ചി ചിലപ്പോൾ ഞങ്ങളെ തിരിച്ചറിയാതെ നോക്കും. പേരുകൾ അമ്മച്ചിയുടെ മനസ്സിന്റെ വാതിൽക്കൽവന്ന് മടങ്ങിപ്പോകും. ഒരിക്കൽ അമ്മച്ചി സ്നേഹത്തോടെ വിളിച്ചിരുന്ന ബന്ധങ്ങൾ ഇന്ന് അമ്മച്ചിയുടെ ഓർമ്മയിൽ മങ്ങിയ നിഴലുകളായി മാത്രം ശേഷിച്ചേക്കാം. പക്ഷേ, ഞങ്ങൾ അമ്മച്ചിയെ തിരിച്ചറിയുന്നു — അമ്മച്ചിയുടെ ശബ്ദത്തിലെ പഴയ ചൂടിൽ, കൈകളിലെ വിറയലിൽ, കണ്ണുകളിൽ പെട്ടെന്ന് തെളിയുന്ന പരിചിതമായ പ്രകാശത്തിൽ.`,
`അമ്മച്ചി മറന്നുപോകുന്ന ഓരോ പേരിനും പകരം ഞങ്ങൾ അമ്മച്ചിയുടെ ജീവിതത്തിലെ ഒരു കഥ ഓർത്തുവെക്കും. അമ്മച്ചിക്ക് മങ്ങിപ്പോകുന്ന ഓരോ മുഖത്തിനും പകരം ഞങ്ങൾ അമ്മച്ചിയുടെ അരികിൽ ഒരു മുഖമായി, ഒരു കൈയായി, ഒരു സ്നേഹമായി നിലകൊള്ളും. അമ്മച്ചിയുടെ ഓർമ്മകൾ ചിതറിപ്പോകുമ്പോൾ, കുടുംബം അമ്മച്ചിയുടെ ചുറ്റും ഒരു പുതിയ പസിൽ തീർക്കും — പഴയ സംഭവങ്ങളുടെ കൃത്യമായ ചിത്രം അല്ല, മറിച്ച് അമ്മച്ചിയെ ഒരിക്കലും ഒറ്റയ്ക്കാക്കില്ലെന്ന വാഗ്ദാനത്തിന്റെ ചിത്രം.`,
`ഒടുവിൽ, ഓർമ്മകൾ മനുഷ്യനെ വിട്ടുപോകാം; എന്നാൽ മനുഷ്യൻ നൽകിയ സ്നേഹം അവനെ വിട്ടുപോകില്ല. അത് മറ്റുള്ളവരുടെ ഹൃദയങ്ങളിൽ വീടുണ്ടാക്കും, തലമുറകളിലൂടെ സഞ്ചരിക്കും, മറവിയുടെ ഇരുട്ടിലും ഒരു ചെറുദീപമായി കത്തിക്കൊണ്ടിരിക്കും.`,
`അമ്മച്ചിയുടെ ഓർമ്മകളുടെ പസിൽ ഒരിക്കലും പൂർണമാകാതെ പോയാലും, അമ്മച്ചിയുടെ ജീവിതത്തെ ചുറ്റിപ്പറ്റിയ സ്നേഹം പൂർണമാകുന്നു. കാരണം, ചില ചിത്രങ്ങൾ കണ്ണുകൊണ്ട് കാണുന്നതല്ല — ഒരുമിച്ച് ചേർന്നുനിൽക്കുന്ന ഹൃദയങ്ങളാൽ പൂർത്തിയാക്കുന്നതാണ്.`,
`ഓർമ്മകൾ മാഞ്ഞുപോയേക്കാം. പേരുകൾ മറന്നുപോയേക്കാം. പക്ഷേ, സ്നേഹത്തോടെ ചേർത്തുപിടിച്ച ജീവിതകഥകൾ കാലത്തിനും മറവിക്കും അതീതമായി കുടുംബത്തിന്റെ ഹൃദയത്തിൽ എന്നും നിലനിൽക്കും.`]}
];
const $=id=>document.getElementById(id);
let cur=0,auto=true,fast=false,snd=false,ac=null,timers=[],mode=`gather`;
// ---------- audio ----------
function note(f,d=.8,type=`sine`,v=.06,at=0){if(!ac||!snd)return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}
const maj=[261.6,293.7,329.6,392,440,523.3],min=[220,261.6,293.7,329.6,392,440];
let amb=null;
function startAmb(){clearInterval(amb);let i=0;amb=setInterval(()=>{const sc=mode===`scatter`?min:maj;note(sc[(i*2+(i%3))%6],2.2,`triangle`,.035);if(i%4===0)note(sc[0]/2,3,`sine`,.04);i++},1500)}
function snap(){note(900,.06,`square`,.04);note(1400,.05,`square`,.03,.05)}
function chime(){note(mode===`scatter`?330:660,.9,`sine`,.05)}
function phone(){for(let k=0;k<3;k++){const b=k*.9;for(let j=0;j<6;j++){note(880,.06,`square`,.04,b+j*.08);note(1180,.06,`square`,.03,b+j*.08+.04)}}}
// ---------- scene ----------
function esc(s){return s.replace(/&/g,`&amp;`).replace(/</g,`&lt;`)}
function show(n){
 cur=(n+S.length)%S.length;const s=S[cur];mode=s.m;
 timers.forEach(clearTimeout);timers=[];
 $(`cnt`).textContent=`അധ്യായം ${cur+1} / ${S.length}`;
 $(`ti`).textContent=`${cur+1}. ${s.t}`;
 const ic=$(`ic`);ic.textContent=s.e;ic.className=`icon`+(s.m===`ring`?` ring`:``);
 document.querySelectorAll(`.dots i`).forEach((d,i)=>d.className=i===cur?`on`:``);
 const bd=$(`bd`);bd.innerHTML=``;
 if(!s.p.length){bd.innerHTML=`<div class="pend">ഈ അധ്യായത്തിന്റെ വാചകം അടുത്ത ഘട്ടത്തിൽ ചേർക്കും.</div>`;return}
 if(s.m===`ring`)phone();
 let delay=300;
 s.p.forEach(x=>{
  const el=document.createElement(`p`);
  if(x.includes(`|`)){const[a,b]=x.split(`|`);el.className=`d`;el.innerHTML=`<b>${esc(a)}:</b> ${esc(b)}`}else el.textContent=x;
  el.style.animationPlayState=`paused`;bd.appendChild(el);
  timers.push(setTimeout(()=>{el.style.animationPlayState=`running`;el.scrollIntoView({behavior:`smooth`,block:`center`});cur===1&&x.includes(`|`)?note(520+(x.length%5)*40,.25,`sine`,.05):(mode===`gather`?snap():chime())},delay));
  delay+=(x.includes(`|`)?1100+x.length*(auto?30:5):2400+x.length*(auto?65:10))*(fast?.3:1);
 });
 if(cur===S.length-1)timers.push(setTimeout(()=>{const e=document.createElement(`div`);e.className=`end`;e.innerHTML=`<h3>അവസാനം</h3><div class="sub">THE END</div><div class="row"><button id="rs">↺ ആദ്യം മുതൽ</button><a href="https://paradiseofross-dotcom.github.io/pages-of-my-life/" target="_blank" rel="noopener" onclick="stopSnd()">മുഖ്യപേജ്</a></div>`;bd.appendChild(e);e.scrollIntoView({behavior:`smooth`,block:`center`});chime();$(`rs`).onclick=()=>show(0)},delay));
 if(auto)timers.push(setTimeout(()=>{if(auto&&cur<S.length-1)show(cur+1)},delay+(fast?800:2500)));
}
// ---------- canvas pieces ----------
const cv=$(`cv`),cx=cv.getContext(`2d`);let W,H,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:30},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*6,s:20+Math.random()*26,h:i*12+10,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,i}))}
addEventListener(`resize`,rs);rs();
function draw(t){
 cx.clearRect(0,0,W,H);
 const cols=6,sz=Math.min(W,H)/12;
 P.forEach(p=>{
  let tx=p.x,ty=p.y;
  if(mode===`gather`){tx=W/2-cols*sz/2+(p.i%cols)*sz;ty=H*.18+Math.floor(p.i/cols)*sz;p.x+=(tx-p.x)*.004;p.y+=(ty-p.y)*.004;p.r*=.995}
  else if(mode===`scatter`){p.x+=p.vx*2;p.y+=p.vy*2;p.r+=.003}
  else{p.x+=p.vx;p.y+=p.vy;}
  if(p.x<-50)p.x=W+40;if(p.x>W+50)p.x=-40;if(p.y<-50)p.y=H+40;if(p.y>H+50)p.y=-40;
  const pulse=mode===`ring`?1+Math.sin(t/120+p.i)*.12:1,s=(mode===`gather`?sz*.9:p.s)*pulse;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=mode===`scatter`?.18:.28;
  cx.fillStyle=`hsl(${p.h},65%,55%)`;cx.beginPath();cx.roundRect(-s/2,-s/2,s,s,s*.2);cx.fill();
  cx.beginPath();cx.arc(s/2,0,s*.18,0,7);cx.fill();cx.restore();
 });
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
// ---------- controls ----------
S.forEach((_,i)=>{const d=document.createElement(`i`);d.textContent=i+1;d.onclick=()=>show(i);$(`dots`).appendChild(d)});
$(`go`).onclick=()=>{$(`intro`).remove();show(0)};
$(`fs`).onclick=e=>{fast=!fast;e.target.textContent=fast?`🐢 സാവധാനം വായിക്കാം`:`⏩ വേഗത്തിൽ വായിക്കാം`;show(cur)};
$(`nx`).onclick=()=>show(cur+1);$(`pv`).onclick=()=>show(cur-1);
function stopSnd(){snd=false;clearInterval(amb);if(ac)ac.suspend();$(`snd`).textContent=`🔈 ശബ്ദം ഓൺ ചെയ്യൂ`}
$(`snd`).onclick=e=>{snd=!snd;if(snd){ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();startAmb();chime()}else clearInterval(amb);e.target.textContent=snd?`🔊 ശബ്ദം ഓഫ് ചെയ്യൂ`:`🔈 ശബ്ദം ഓൺ ചെയ്യൂ`};
$(`pl`).onclick=e=>{auto=!auto;e.target.textContent=auto?`⏸ ഓട്ടോ`:`▶ ഓട്ടോ`;show(cur)};
</script></body></html>
